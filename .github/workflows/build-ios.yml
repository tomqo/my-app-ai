name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r css js icons www/

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync iOS
        run: npx cap sync ios

      - name: Build IPA (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA manually
        run: |
          cd ios/App/build
          mkdir -p ipa/Payload
          cp -r App.xcarchive/Products/Applications/App.app ipa/Payload/
          cd ipa
          zip -r ../AI-Chat.ipa Payload
          cd ..
          ls -lh AI-Chat.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AI-Chat-IPA
          path: ios/App/build/AI-Chat.ipa
