<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI Chat" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="description" content="BYOK 通用 AI 聊天前端：多模型、多会话、角色预设、语音输入。" />
  <title>AI Chat</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <img src="icons/icon.svg" alt="" class="brand-logo" />
          <span class="brand-name sidebar-label">AI Chat</span>
          <button id="btn-collapse-sidebar" class="btn btn-icon btn-sm side-collapse-btn" title="\u6298\u53e0\u4fa7\u680f"></button>
        </div>
        <button id="btn-new-chat" class="btn btn-primary btn-block" title="新建对话">＋ 新对话</button>
      </div>

      <div class="search-box">
        <input id="search-input" type="search" placeholder="搜索历史对话…" autocomplete="off" />
      </div>
      <div id="search-results" class="search-results" hidden></div>

      <nav id="session-list" class="session-list" aria-label="会话列表"></nav>

      <div class="sidebar-bottom">
        <button id="btn-presets" class="btn btn-ghost btn-block"><span class="sidebar-label">🧩 角色与指令</span></button>
        <button id="btn-settings" class="btn btn-ghost btn-block"><span class="sidebar-label">⚙️ 设置</span></button>
      </div>
    </aside>

    <main id="main" class="main">
      <header class="chat-header">
        <button id="btn-toggle-sidebar" class="btn btn-icon" title="切换侧栏">☰</button>
        <div class="chat-title-wrap">
          <span id="chat-title" class="chat-title">新对话</span>
          <span id="chat-subtitle" class="chat-subtitle"></span>
        </div>
        <div class="chat-header-actions">
          <select id="model-select" class="select" title="切换模型"></select>
          <button id="btn-chat-menu" class="btn btn-icon" title="对话操作">⋯</button>
        </div>
      </header>

      <div id="messages" class="messages" aria-live="polite"></div>

      <div id="composer" class="composer">
        <div id="system-prompt-bar" class="system-prompt-bar" hidden>
          <span class="system-prompt-label">角色</span>
          <span id="system-prompt-preview" class="system-prompt-preview"></span>
          <button id="btn-clear-system" class="btn btn-icon btn-sm" title="移除角色">✕</button>
        </div>
        <div class="composer-input-row">
          <textarea id="input" class="composer-input" rows="1"
            placeholder="输入消息，Enter 发送，Shift+Enter 换行" autocomplete="off"></textarea>
          <button id="btn-voice" class="btn btn-icon btn-tool" title="语音输入">🎤</button>
          <button id="btn-attach" class="btn btn-icon btn-tool" title="粘贴图片">🖼️</button>
          <button id="btn-send" class="btn btn-primary btn-send">发送</button>
          <button id="btn-stop" class="btn btn-danger btn-send" title="停止生成" hidden>■</button>
        </div>
        <div class="composer-hint">
          <span>数据保存在本机 · API Key 不出设备</span>
        </div>
      </div>
    </main>
  </div>

  <!-- 会话操作菜单 -->
  <div id="chat-menu" class="popover" hidden></div>

  <!-- 模态遮罩 -->
  <div id="modal-backdrop" class="modal-backdrop" hidden></div>

  <!-- 设置 -->
  <div id="settings-modal" class="modal" hidden role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2>设置</h2>
      <button class="btn btn-icon modal-close" data-close>✕</button>
    </div>
    <div class="modal-body">
      <section class="modal-section">
        <h3>端点与模型</h3>
        <p class="muted">添加你的 OpenAI 兼容端点（qnaigc、OpenAI、DeepSeek 等），每把 Key 一个端点。</p>
        <div id="endpoint-list" class="endpoint-list"></div>
        <button id="btn-add-endpoint" class="btn btn-outline btn-block">＋ 添加端点</button>
      </section>

      <section class="modal-section">
        <h3>默认参数</h3>
        <div class="form-grid">
          <label class="field">
            <span>Temperature</span>
            <input id="set-temperature" type="number" min="0" max="2" step="0.1" value="0.7" />
          </label>
          <label class="field">
            <span>最大输出 Token</span>
            <input id="set-max-tokens" type="number" min="1" max="128000" step="1" value="4096" />
          </label>
          <label class="field">
            <span>主题</span>
            <select id="set-theme" class="select">
              <option value="dark">深色</option>
              <option value="light">浅色</option>
              <option value="auto">跟随系统</option>
            </select>
          </label>
          <label class="field">
            <span>语音识别语言</span>
            <select id="set-voice-lang" class="select">
              <option value="zh-CN">普通话（中文）</option>
              <option value="zh-TW">国语（台湾）</option>
              <option value="en-US">English (US)</option>
              <option value="ja-JP">日本語</option>
              <option value="ko-KR">한국어</option>
            </select>
          </label>
        </div>
        <label class="field field-check">
          <input id="set-tts-enabled" type="checkbox" />
          <span>朗读回复（语音输出）</span>
        </label>
      </section>

      <section class="modal-section">
        <h3>数据</h3>
        <div class="btn-row">
          <button id="btn-export-all" class="btn btn-outline">导出全部为 Markdown</button>
          <button id="btn-clear-all" class="btn btn-danger-outline">清空所有数据</button>
        </div>
      </section>
    </div>
  </div>

  <!-- 端点编辑 -->
  <div id="endpoint-modal" class="modal" hidden role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 id="endpoint-modal-title">添加端点</h2>
      <button class="btn btn-icon modal-close" data-close>✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <label class="field">
          <span>名称</span>
          <input id="ep-name" type="text" placeholder="例如：qnaigc Default" />
        </label>
        <label class="field">
          <span>Base URL</span>
          <input id="ep-base" type="text" placeholder="https://api.example.com/v1" />
        </label>
        <label class="field field-span">
          <span>API Key</span>
          <input id="ep-key" type="password" placeholder="sk-…" autocomplete="off" />
        </label>
        <label class="field field-span">
          <span>模型（每行一个，或用逗号分隔）</span>
          <textarea id="ep-models" rows="4" placeholder="gpt-4o-mini&#10;gpt-4o&#10;gpt-4-vision"></textarea>
        </label>
      </div>
      <div class="btn-row">
        <button id="btn-fetch-models" class="btn btn-outline">从 /models 拉取</button>
        <button id="btn-save-endpoint" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 角色与指令 -->
  <div id="presets-modal" class="modal" hidden role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2>角色与指令</h2>
      <button class="btn btn-icon modal-close" data-close>✕</button>
    </div>
    <div class="modal-body">
      <div class="tabs" id="preset-tabs">
        <button class="tab active" data-tab="role">角色预设</button>
        <button class="tab" data-tab="prompt">提示词模板</button>
        <button class="tab" data-tab="command">快捷指令</button>
      </div>
      <div id="preset-list" class="preset-list"></div>
      <button id="btn-add-preset" class="btn btn-outline btn-block">＋ 添加</button>
    </div>
  </div>

  <!-- 预设编辑 -->
  <div id="preset-modal" class="modal" hidden role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 id="preset-modal-title">添加预设</h2>
      <button class="btn btn-icon modal-close" data-close>✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <label class="field">
          <span>类型</span>
          <select id="preset-kind" class="select">
            <option value="role">角色（设置系统提示词）</option>
            <option value="prompt">提示词模板（插入到系统提示词）</option>
            <option value="command">快捷指令（作为消息发送）</option>
          </select>
        </label>
        <label class="field">
          <span>名称</span>
          <input id="preset-name" type="text" placeholder="例如：韩语老师" />
        </label>
        <label class="field field-span">
          <span>内容</span>
          <textarea id="preset-content" rows="6" placeholder="例如：你是韩语老师，用威妥玛拼音标注发音…"></textarea>
        </label>
      </div>
      <div class="btn-row">
        <button id="btn-save-preset" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
